name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Core Library Build & Test (All Platforms)
  # ============================================================

  build-linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPQC_BUILD_TESTS=ON \
            -DPQC_BUILD_BENCHMARKS=ON \
            -DPQC_BUILD_CLI=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Upload build artifacts
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: |
            build/libpqc.*
            build/pqc-cli

  build-linux-arm64:
    name: Linux ARM64
    # Native ARM64 hardware. This previously ran aarch64 under QEMU via
    # run-on-arch-action, where clang itself segfaulted partway through the
    # build ("Segmentation fault (core dumped)" compiling sha2.c) -- an
    # emulation failure, not a defect in the code. GitHub provides free
    # ARM64 runners for public repositories, which removes the emulation
    # layer and is far faster besides.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # Still advisory until this has demonstrated a clean run on the new
    # runner; flip to a required job once it has.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq cmake ninja-build clang
      - name: Build and test
        env:
          CC: clang
          CXX: clang++
        # ASM stays off to keep this job testing exactly what it tested
        # under emulation. Enabling the ARM assembly paths here is a
        # separate change worth making on its own.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPQC_BUILD_TESTS=ON -DPQC_ENABLE_ASM=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure --timeout 600

  build-macos:
    name: macOS (${{ matrix.arch }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Only the x86_64 entry is advisory. macos-13 is the Intel image GitHub
    # is retiring, and capacity for it has dried up: this job sat queued
    # and was superseded in five consecutive runs without ever starting.
    # That is a runner-availability problem, not a signal about the code,
    # and it should not gate the run -- the same treatment FreeBSD already
    # gets below. The arm64 entries stay blocking.
    #
    # Worth revisiting: retarget to whichever Intel image currently has
    # capacity, since this library does carry x86_64 assembly paths and
    # losing Intel coverage is a real gap, not a tidy-up.
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            build_type: Release
          - runner: macos-13
            arch: x86_64
            build_type: Release
          - runner: macos-14
            arch: arm64
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPQC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

  build-windows:
    name: Windows (${{ matrix.label }}, ${{ matrix.build_type }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty generator means "let CMake pick the newest Visual
          # Studio on the runner". Pinning the generator string breaks
          # every time GitHub rolls windows-latest to a new VS release --
          # "Visual Studio 17 2022" stopped resolving when the image moved
          # past VS 2022, and the job then failed at configure time with
          # "could not find any instance of Visual Studio".
          - generator: ""
            label: MSVC
            build_type: Release
          - generator: ""
            label: MSVC
            build_type: Debug
          - generator: "MinGW Makefiles"
            label: MinGW
            build_type: Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.generator }}" ]; then
            cmake -B build -G "${{ matrix.generator }}" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPQC_BUILD_TESTS=ON
          else
            cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPQC_BUILD_TESTS=ON
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600 -C ${{ matrix.build_type }}

  build-freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # FreeBSD VM is best-effort; package availability can vary
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake ninja
          run: |
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPQC_BUILD_TESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure --timeout 600

  # ============================================================
  # Security & Quality Checks
  # ============================================================

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Sanitizers may flag issues in algorithms under development; treat as advisory
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, memory]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Configure with sanitizer
        env:
          CC: clang
          CXX: clang++
        run: |
          SANITIZER_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          if [ "${{ matrix.sanitizer }}" = "memory" ]; then
            SANITIZER_FLAGS="$SANITIZER_FLAGS -fsanitize-memory-track-origins"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPQC_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          if [ "${{ matrix.sanitizer }}" = "memory" ]; then
            # MSan with origins tracking is slow enough that the hash-heavy
            # suites cannot finish: test_sig (SLH-DSA), test_security_audit
            # (XMSS rebuilds a Merkle tree per signature, LMS builds 2^10
            # leaves) and test_fndsa_quick (FN-DSA keygen). All three still
            # run under ASan and UBSan above, so they are unchecked only by
            # MSan. See the matching note in security.yml. The OpenSSL
            # interop test (label "interop") signs with every SLH-DSA
            # parameter set through an instrumented tool and has its own job.
            ctest --test-dir build --output-on-failure --timeout 1800 \
              --exclude-regex "test_sig|test_security_audit|test_fndsa_quick|test_kat_slhdsa" \
              --label-exclude interop
          else
            ctest --test-dir build --output-on-failure --timeout 1800
          fi

  valgrind:
    name: Valgrind Memory Check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build valgrind
      - name: Build
        # -g -O1 rather than a full Debug (-O0) build. Valgrind is slow
        # enough that unoptimised code pushed this job past its one-hour
        # ceiling, where it was killed and reported as cancelled. -O1
        # keeps symbols and accurate line numbers while running several
        # times faster; the equivalent job in security.yml uses the same
        # flags and completes in about 24 minutes.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPQC_BUILD_TESTS=ON -DCMAKE_C_FLAGS="-g -O1"
          cmake --build build
      - name: Run tests under Valgrind
        run: |
          valgrind --tool=memcheck \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --error-exitcode=1 \
            ./build/tests/test_kem
          valgrind --tool=memcheck \
            --leak-check=full \
            --error-exitcode=1 \
            ./build/tests/test_sig
          valgrind --tool=memcheck \
            --leak-check=full \
            --error-exitcode=1 \
            ./build/tests/test_hash

  # Constant-time check (ctgrind): the library's RNG output is marked
  # undefined, so memcheck reports every branch and memory index derived
  # from secrets. See tests/ct/test_ct.c. Blocking for the algorithms in
  # tests/ct/ct_gate.txt; the full report runs weekly in security.yml.
  constant-time:
    name: Constant-Time Verification (ctgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build valgrind
      - name: Build
        # -O2: the optimised code is what ships, and what the compiler
        # emits at -O2 is what has to be free of secret-dependent branches.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g" \
            -DPQC_ENABLE_CT_TESTING=ON \
            -DPQC_BUILD_SHARED=OFF \
            -DPQC_BUILD_BENCHMARKS=OFF \
            -DPQC_BUILD_CLI=OFF
          cmake --build build --target test_ct
      - name: Run ctgrind on gated algorithms
        run: |
          python3 tests/ct/run_ctgrind.py build/tests/test_ct \
            --gate tests/ct/ct_gate.txt --gate-only \
            --report ct-report.md --logs ct-logs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctgrind-gated
          path: |
            ct-report.md
            ct-logs/

  # libFuzzer on the inputs an attacker controls: signature verification
  # (signature, public key, context) and KEM decapsulation / encapsulation
  # (ciphertext, public key). See tests/fuzz/*.c. Any crash, sanitizer
  # report, timeout or out-of-memory fails the job and its input is
  # uploaded. The corpus is cached between runs so coverage accumulates.
  fuzzing:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Build fuzz targets
        env:
          CC: clang
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPQC_BUILD_FUZZERS=ON \
            -DPQC_BUILD_SHARED=OFF \
            -DPQC_BUILD_BENCHMARKS=OFF \
            -DPQC_BUILD_CLI=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build --target fuzz_sig_verify fuzz_kem
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz (10 minutes per target)
        run: |
          mkdir -p crashes
          status=0
          for fz in fuzz_sig_verify fuzz_kem; do
            mkdir -p corpus/$fz
            ./build/tests/$fz -max_total_time=600 -timeout=120 \
              -rss_limit_mb=4096 -print_final_stats=1 \
              -artifact_prefix=crashes/$fz- corpus/$fz || status=1
          done
          exit $status
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crashes/

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tools cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --inconclusive --error-exitcode=1 \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            -I include/ -I src/ \
            src/core/ 2>&1 | tee cppcheck.log
      - name: Run clang static analyzer
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPQC_BUILD_TESTS=ON -DCMAKE_C_COMPILER=clang
          scan-build --status-bugs cmake --build build 2>&1 | tee scan-build.log

  # ============================================================
  # Algorithm Verification
  # ============================================================

  kat-validation:
    name: Known-Answer & Round-Trip Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPQC_BUILD_TESTS=ON
          cmake --build build
      # This step used to be:
      #   ctest -R "kat" || echo "No KAT tests registered yet"
      # No test name matched "kat", so ctest selected nothing and the
      # `|| echo` swallowed the empty result: the job reported green having
      # validated no vectors at all. It now selects by the "kat" ctest label
      # and fails if that selection is empty, so a vector suite cannot drop
      # out of the run silently.
      #
      # Labelled today: test_hash (FIPS 180-4, FIPS 202, RFC 4231),
      # test_hybrid_classical (RFC 7748, RFC 8032, RFC 6979, NIST CAVP),
      # test_kat_bike (official round 4 KATs), and test_kat_mlkem,
      # test_kat_mldsa and test_kat_slhdsa (NIST ACVP vectors for FIPS
      # 203, 204 and 205). test_kat_slhdsa runs one signing vector per
      # parameter set; the next step runs all of them.
      - name: Run known-answer vector tests
        run: |
          set -euo pipefail
          count=$(ctest --test-dir build -N -L kat | sed -n 's/^Total Tests: //p')
          echo "Known-answer test suites selected: ${count:-0}"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No tests carry the 'kat' label. Do not mask this with '|| echo'."
            exit 1
          fi
          ctest --test-dir build --output-on-failure -L kat
      - name: Run every SLH-DSA ACVP signing vector
        run: ./build/tests/test_kat_sig_acvp tests/kat/slhdsa_acvp.txt
      - name: Run KEM round-trip tests
        run: ./build/tests/test_kem
      - name: Run Signature round-trip tests
        run: ./build/tests/test_sig

  interop:
    name: Interoperability (OpenSSL >= 3.5, ML-DSA / SLH-DSA)
    # Signs with libpqc and verifies with OpenSSL, and the reverse, for every
    # ML-DSA and SLH-DSA parameter set, with and without a context string.
    # A round-trip test cannot see a defect that sign and verify share; this
    # can. ubuntu-latest (Ubuntu 26.04) ships OpenSSL 3.5, which has both
    # algorithms; this job previously used Homebrew's openssl@3 on macOS.
    # The driver runs directly rather than under ctest, because under ctest
    # a missing algorithm is "skipped" (exit 77), which here must fail --
    # as must an OpenSSL without the algorithms.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build openssl
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPQC_BUILD_TESTS=ON
          cmake --build build --target pqc_sig_tool
      - name: Cross-check against OpenSSL
        run: |
          set -euo pipefail
          openssl version
          python3 tests/interop/openssl_interop.py build/tests/pqc_sig_tool --require-all --openssl openssl

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPQC_BUILD_TESTS=ON -DPQC_BUILD_BENCHMARKS=ON
          cmake --build build
      - name: Run KEM benchmarks
        run: ./build/tests/bench_kem
      - name: Run Signature benchmarks
        run: ./build/tests/bench_sig

  # ============================================================
  # Language Binding Tests
  # ============================================================

  binding-python:
    name: Python Binding
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build; 3.9 is
    # still inside the binding's declared range, so it runs on 24.04.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python-version: '3.9'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install core library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Install Python bindings
        run: pip install ./bindings/python pytest
      - name: Test Python bindings
        run: python -m pytest bindings/python/tests/ -v

  binding-rust:
    name: Rust Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install core library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Test Rust bindings
        run: cd bindings/rust && cargo test

  binding-go:
    name: Go Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - name: Build and install core library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Create pkg-config file
        run: |
          sudo mkdir -p /usr/local/lib/pkgconfig
          cat <<'PCEOF' | sudo tee /usr/local/lib/pkgconfig/libpqc.pc
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: libpqc
          Description: Post-Quantum Cryptography Library
          Version: 0.1.0
          Libs: -L${libdir} -lpqc
          Cflags: -I${includedir}
          PCEOF
      - name: Test Go bindings
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          CGO_CFLAGS: -I/usr/local/include
          CGO_LDFLAGS: -L/usr/local/lib -lpqc
        run: cd bindings/go && go test -v ./...

  binding-java:
    name: Java Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Keep downloaded Maven plugins between runs: every run fetching
          # them from Maven Central is how this job got rate-limited (429).
          cache: 'maven'
          cache-dependency-path: bindings/java/pom.xml
      - name: Build and install core library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Build JNI
        # javac -h only emits the headers. The JNI shared object still has
        # to be compiled and placed somewhere the JVM will look, otherwise
        # every test dies with
        #   UnsatisfiedLinkError: no pqc_jni in java.library.path
        run: |
          cd bindings/java
          javac -h src/main/native src/main/java/com/dyber/pqc/*.java
          cc -shared -fPIC -O2 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -I src/main/native \
            -I ../../include \
            src/main/native/com_dyber_pqc_PQC.c \
            -o libpqc_jni.so -lpqc
      - name: Test Java bindings
        # Retried only when Maven reports that it could not download from
        # the repository (Maven Central answers 429 under load). A test or
        # build failure is never retried.
        run: |
          set -o pipefail
          cd bindings/java
          for attempt in 1 2 3; do
            if mvn -B test -DargLine="-Djava.library.path=$PWD" 2>&1 | tee mvn.log; then
              exit 0
            fi
            if ! grep -qE "Could not transfer artifact|Could not resolve dependencies|could not be resolved" mvn.log; then
              exit 1
            fi
            echo "Maven repository error (attempt $attempt); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1

  binding-csharp:
    name: C# Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and install core library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Build C# bindings
        run: cd bindings/csharp && dotnet build
      - name: Test C# bindings
        run: cd bindings/csharp && dotnet test tests/PqcDyber.Tests.csproj

  binding-node:
    name: JavaScript/TypeScript Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and install core library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Build Node addon
        run: |
          cd bindings/javascript
          npm install
          npm run build || true
      - name: Test
        run: cd bindings/javascript && npm test || true

  binding-cpp:
    name: C++ Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build core + C++ tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sudo cmake --install build
          sudo ldconfig
      - name: Build C++ binding tests
        run: |
          cd bindings/cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test C++ bindings
        run: cd bindings/cpp/build && ctest --output-on-failure

  # ============================================================
  # CLI Tool Verification
  # ============================================================

  cli-test:
    name: CLI Tool Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPQC_BUILD_TESTS=ON -DPQC_BUILD_CLI=ON
          cmake --build build
      - name: Test CLI version
        run: ./build/pqc-cli version
      - name: Test CLI algorithms listing
        run: ./build/pqc-cli algorithms
      - name: Test KEM round-trip via CLI
        run: |
          ./build/pqc-cli keygen ML-KEM-768 --pk /tmp/pk.bin --sk /tmp/sk.bin
          ./build/pqc-cli encaps ML-KEM-768 --pk /tmp/pk.bin --ct /tmp/ct.bin --ss /tmp/ss1.bin
          ./build/pqc-cli decaps ML-KEM-768 --sk /tmp/sk.bin --ct /tmp/ct.bin --ss /tmp/ss2.bin
          diff /tmp/ss1.bin /tmp/ss2.bin
      - name: Test Signature round-trip via CLI
        run: |
          echo "Test message" > /tmp/msg.txt
          ./build/pqc-cli keygen ML-DSA-65 --pk /tmp/sig_pk.bin --sk /tmp/sig_sk.bin
          ./build/pqc-cli sign ML-DSA-65 --sk /tmp/sig_sk.bin --msg /tmp/msg.txt --sig /tmp/sig.bin
          ./build/pqc-cli verify ML-DSA-65 --pk /tmp/sig_pk.bin --msg /tmp/msg.txt --sig /tmp/sig.bin

  # ============================================================
  # Build Configuration Matrix
  # ============================================================

  minimal-build:
    name: Minimal Build (core only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build with all algorithms disabled except ML-KEM
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPQC_ENABLE_KEM_HQC=OFF \
            -DPQC_ENABLE_KEM_BIKE=OFF \
            -DPQC_ENABLE_KEM_MCELIECE=OFF \
            -DPQC_ENABLE_KEM_FRODO=OFF \
            -DPQC_ENABLE_KEM_NTRU=OFF \
            -DPQC_ENABLE_KEM_NTRUPRIME=OFF \
            -DPQC_ENABLE_SIG_SLHDSA=OFF \
            -DPQC_ENABLE_SIG_FNDSA=OFF \
            -DPQC_ENABLE_SIG_SPHINCSPLUS=OFF \
            -DPQC_ENABLE_SIG_MAYO=OFF \
            -DPQC_ENABLE_SIG_UOV=OFF \
            -DPQC_ENABLE_SIG_SNOVA=OFF \
            -DPQC_ENABLE_SIG_CROSS=OFF \
            -DPQC_ENABLE_SIG_LMS=OFF \
            -DPQC_ENABLE_SIG_XMSS=OFF \
            -DPQC_ENABLE_HYBRID=OFF \
            -DPQC_ENABLE_ASM=OFF \
            -DPQC_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure --timeout 600

  static-only-build:
    name: Static Library Only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build static only
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPQC_BUILD_SHARED=OFF \
            -DPQC_BUILD_STATIC=ON \
            -DPQC_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure --timeout 600

  no-asm-build:
    name: Pure C (No ASM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build without ASM
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPQC_ENABLE_ASM=OFF \
            -DPQC_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure --timeout 600
