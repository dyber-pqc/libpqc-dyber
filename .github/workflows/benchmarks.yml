#
# Benchmark CI workflow.
# Runs performance benchmarks on every push to main and weekly.
# Detects regressions (>10% slower than baseline) and posts PR comments.

name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  BENCHMARK_ITERATIONS: 500
  REGRESSION_THRESHOLD: 10  # percent

jobs:
  benchmark:
    name: Bench (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    # Headroom above the measured runtime. The per-algorithm iteration
    # scaling in bench_common.h is what keeps this bounded; this ceiling
    # only catches a runaway.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          # macOS (Apple Silicon). macos-14 was retired on 2026-11-02.
          - os: macos-15
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-15
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          # Windows
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
          - os: windows-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq cmake ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -yq clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            brew install gcc@14
          fi

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DPQC_BUILD_BENCHMARKS=ON \
            -DPQC_BUILD_TESTS=ON

      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DPQC_BUILD_BENCHMARKS=ON `
            -DPQC_BUILD_TESTS=ON

      - name: Setup MSVC for Clang (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'clang'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Windows Clang)
        if: runner.os == 'Windows' && matrix.compiler == 'clang'
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DPQC_BUILD_BENCHMARKS=ON `
            -DPQC_BUILD_TESTS=ON

      - name: Build benchmarks
        run: cmake --build build --config Release --target bench_all bench_kem bench_sig bench_hash

      # ---- Run benchmarks ----

      # Run the suite ONCE.
      #
      # This previously invoked bench_all three times -- once for CSV, once
      # for JSON, once for a human-readable table -- and each invocation is
      # a full sweep of every algorithm. That tripled the cost for no gain:
      # the only consumer of any of it is the CSV, which both
      # regression-check and store-history read. The JSON artifact was
      # uploaded and never read by any job.
      #
      # bench_all takes a single output format per run, so the table for the
      # log comes from printing the CSV rather than re-measuring everything.
      - name: Run full benchmark suite (CSV)
        run: |
          ./build/tests/bench_all --csv --iterations ${{ env.BENCHMARK_ITERATIONS }} --output bench_results.csv
        shell: bash

      - name: Show results in the log
        run: cat bench_results.csv
        shell: bash

      # ---- Upload artifacts ----

      - name: Upload benchmark results (CSV)
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}-${{ matrix.compiler }}-csv
          path: bench_results.csv
          retention-days: 90

      # The JSON artifact is deliberately gone. Producing it needed a second
      # full sweep of every algorithm on every runner, and no job in this
      # repository ever read it -- regression-check and store-history both
      # parse the CSV. To bring it back, add a step that converts
      # bench_results.csv rather than re-running bench_all with --json.

  # ---- Regression detection ----
  #
  # Both sides are measured on the same runner in the same job. This used
  # to compare the PR's numbers with the last main run's artifact, which
  # came from a different machine: GitHub's ubuntu-latest pool mixes CPU
  # models, and between two of them every benchmark moved 15-25% (by
  # different amounts for SHA-2- and SHA-3-heavy code), so the check
  # failed on a commit that only changed a test. Now the base commit and
  # the PR (GitHub's merge commit) are built side by side and run in ABBA
  # order -- base, PR, PR, base -- so drift during the job cancels; each
  # side's figure is the lower of its two medians.
  regression-check:
    name: Performance regression check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'pull_request'

    env:
      REGRESSION_ITERATIONS: 100
      # Below this the median is a handful of timer ticks.
      REGRESSION_FLOOR_MS: 0.02

    steps:
      - name: Checkout the PR (merge commit)
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq cmake ninja-build

      - name: Build bench_all for both
        run: |
          for side in base head; do
            cmake -S $side -B build-$side -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPQC_BUILD_BENCHMARKS=ON -DPQC_BUILD_TESTS=ON
            cmake --build build-$side --target bench_all
          done

      - name: Run base, PR, PR, base
        run: |
          i=0
          for side in base head head base; do
            i=$((i + 1))
            ./build-$side/tests/bench_all --csv \
              --iterations "$REGRESSION_ITERATIONS" \
              --output "run$i-$side.csv"
          done

      - name: Compare benchmarks and detect regressions
        id: regression
        shell: python3 {0}
        run: |
          import csv
          import os

          threshold = float(os.environ.get("REGRESSION_THRESHOLD", "10"))
          floor = float(os.environ.get("REGRESSION_FLOOR_MS", "0.02"))

          def load(path):
              out = {}
              with open(path) as f:
                  for row in csv.DictReader(f):
                      try:
                          out[f"{row['algorithm']}:{row['operation']}"] = float(row["median_ms"])
                      except (ValueError, KeyError):
                          pass
              return out

          b1, b4 = load("run1-base.csv"), load("run4-base.csv")
          c2, c3 = load("run2-head.csv"), load("run3-head.csv")

          def spread(x, y):
              # Run-to-run variation of one side on this machine, in %.
              return abs(x - y) / min(x, y) * 100.0

          # A change counts only if it exceeds the threshold *plus* the
          # larger of the two sides' own run-to-run spread for that entry.
          # Rejection-sampled operations (ML-DSA signing, for one) vary a
          # lot between runs of identical code; a fixed threshold alone
          # flags them at random.
          regressions, improvements = [], []
          for key in sorted(set(b1) & set(b4) & set(c2) & set(c3)):
              b, c = min(b1[key], b4[key]), min(c2[key], c3[key])
              if b < floor:
                  continue
              noise = max(spread(b1[key], b4[key]), spread(c2[key], c3[key]))
              pct = (c - b) / b * 100.0
              if pct > threshold + noise:
                  regressions.append((key, b, c, pct, noise))
              elif pct < -(threshold + noise):
                  improvements.append((key, b, c, pct, noise))

          lines = ["## Benchmark Comparison Report\n",
                   f"Base and PR measured on the same runner (ABBA order); "
                   f"a change counts if it exceeds {threshold}% plus that "
                   f"entry's run-to-run spread. Regressions: {len(regressions)} | "
                   f"Improvements: {len(improvements)}\n"]

          def table(title, rows, sign):
              lines.append(f"\n### {title}\n")
              lines.append("| Algorithm | Operation | Base (ms) | PR (ms) | Change | Run-to-run spread |")
              lines.append("|-----------|-----------|-----------|---------|--------|-------------------|")
              for key, b, c, pct, noise in rows:
                  algo, op = key.split(":", 1)
                  lines.append(f"| {algo} | {op} | {b:.3f} | {c:.3f} | {sign}{pct:.1f}% | {noise:.1f}% |")

          if regressions:
              table("Regressions (slower)", sorted(regressions, key=lambda x: -x[3]), "+")
          if improvements:
              table("Improvements (faster)", sorted(improvements, key=lambda x: x[3]), "")
          if not regressions and not improvements:
              lines.append(f"\nAll benchmarks within {threshold}% (plus run-to-run spread) of the base.")

          with open("benchmark_summary.md", "w") as f:
              f.write("\n".join(lines))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_regression={'true' if regressions else 'false'}\n")

          if regressions:
              print(f"REGRESSION DETECTED: {len(regressions)} benchmarks are slower "
                    f"by more than {threshold}% plus their run-to-run spread")
              for key, b, c, pct, noise in regressions:
                  print(f"  {key}: {b:.3f}ms -> {c:.3f}ms (+{pct:.1f}%, spread {noise:.1f}%)")
          else:
              print("No performance regressions detected.")

      - name: Post benchmark comparison as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-results
          path: benchmark_summary.md

      - name: Upload the four runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-check-runs
          path: run*.csv
          retention-days: 30

      - name: Fail on regression
        if: steps.regression.outputs.has_regression == 'true'
        run: |
          echo "Performance regression detected! See PR comment for details."
          exit 1

  # ---- Historical tracking ----
  store-results:
    name: Store benchmark history
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: results/

      - name: Create benchmark summary
        shell: bash
        run: |
          echo "# Benchmark Results - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > summary.md
          echo "" >> summary.md
          echo "Commit: ${{ github.sha }}" >> summary.md
          echo "" >> summary.md

          for dir in results/benchmarks-*-csv; do
            if [ -d "$dir" ]; then
              platform=$(basename "$dir" | sed 's/benchmarks-//' | sed 's/-csv//')
              echo "## Platform: $platform" >> summary.md
              echo "" >> summary.md
              echo '```' >> summary.md
              head -20 "$dir/bench_results.csv" >> summary.md
              echo '...' >> summary.md
              echo '```' >> summary.md
              echo "" >> summary.md
            fi
          done

      - name: Upload combined benchmark history
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history-${{ github.sha }}
          path: |
            results/
            summary.md
          retention-days: 365
